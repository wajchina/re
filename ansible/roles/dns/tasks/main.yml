---

- name: import assert.yml
  ansible.builtin.import_tasks: assert.yml
  run_once: yes
  delegate_to: localhost
  tags: dns-server

- name: install dns
  ansible.builtin.package:
    name: "{{ dns_packages }}"
    state: present
  tags: dns-server

- name: create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
  loop:
    - path: "{{ dns_datadir }}"
      mode: "1770"
      owner: "{{ dns_owner }}"
      group: "{{ dns_group }}"
    - path: "{{ dns_confdir }}"
      mode: "0755"
      owner: root
      group: root
  loop_control:
    label: "{{ item.path }}"
  tags: dns-server

- name: create group
  group:
    name: "{{ dns_group }}"
    state: present
  tags: dns-server

- name: create user
  user:
    name: "{{ dns_owner }}"
    state: present
    system: yes
  tags: dns-server

- name: generate rndc key
  ansible.builtin.command:
    cmd: rndc-confgen -a -c "{{ dns_confdir }}/rndc.key"
    creates: "{{ dns_confdir }}/rndc.key"
  tags: dns-server

- name: set permissions on rndc key file
  ansible.builtin.file:
    path: "{{ dns_confdir }}/rndc.key"
    owner: "{{ dns_owner }}"
    group: "{{ dns_group }}"
    mode: "0640"
  tags: dns-server

- name: place the hints/root file
  ansible.builtin.copy:
    src: named.root
    dest: "{{ dns_datadir }}/named.root"
    owner: "{{ dns_owner }}"
    group: "{{ dns_group }}"
    mode: "0640"
  when:
    - dns_caching_dns | bool
  notify:
    - rndc reload
  tags: dns-server

- name: create zone files
  ansible.builtin.template:
    src: zone.j2
    dest: "{{ dns_datadir }}/{{ item.name }}.conf"
    mode: "0640"
    owner: "{{ dns_owner }}"
    group: "{{ dns_group }}"
  loop: "{{ dns_zones }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.type is undefined or
      item.type == "master"
  notify:
    - rndc reload
  tags: dns-server

- name: add zones to configuration
  ansible.builtin.template:
    src: named.conf.j2
    dest: "{{ dns_confdir }}/named.conf"
    validate: named-checkconf -zj %s
    mode: "0640"
    owner: "{{ dns_owner }}"
    group: "{{ dns_group }}"
    backup: yes
  notify:
    - Restart dns
  tags: dns-server

- name: place systemd override
  block:
    - name: create /etc/systemd/system/{{ dns_service }}.service.d
      ansible.builtin.file:
        path: /etc/systemd/system/{{ dns_service }}.service.d
        state: directory
        mode: "0755"

    - name: place override.conf
      ansible.builtin.copy:
        src: override.conf
        dest: /etc/systemd/system/{{ dns_service }}.service.d/override.conf
        owner: root
        group: root
        mode: "0644"

    - name: systemctl daemon-reload
      systemd:
        daemon_reload: yes
      changed_when: no
  when:
    - ansible_service_mgr == "systemd"
  tags: dns-server

- name: start and enable dns
  ansible.builtin.service:
    name: "{{ dns_service }}"
    state: started
    enabled: yes
  tags: dns-server
