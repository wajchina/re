---

- name: Import assert.yml
  ansible.builtin.import_tasks: assert.yml
  run_once: yes
  delegate_to: localhost

- name: Install requirements
  ansible.builtin.package:
    name: "{{ sysctl_requirements }}"
    state: present

- name: Set vm.min_free_kbytes to 524288 for mem<=32G hosts
  ansible.builtin.set_fact:
    VM_MIN_FREE_KBYTES=524288
  when: ansible_memtotal_mb | int <= 32768

- name: Set vm.min_free_kbytes to 1048576 for 32G<mem<=1T hosts
  ansible.builtin.set_fact:
    VM_MIN_FREE_KBYTES=1048576
  when: ansible_memtotal_mb | int >= 32768 and ansible_memtotal_mb | int <= 1048576

- name: Set vm.min_free_kbytes to 2097152 for mem>1T hosts
  ansible.builtin.set_fact:
    VM_MIN_FREE_KBYTES=2097152
  when: ansible_memtotal_mb | int >= 1048576

- name: Set sysctl vm.min_free_kbytes
  ansible.posix.sysctl:
    name: vm.min_free_kbytes
    value: "{{ VM_MIN_FREE_KBYTES }}"
    sysctl_set: "{{ sysctl_set }}"
    state: present
    reload: "{{ sysctl_reload }}"

- name: Set sysctl setting
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: "{{ sysctl_set }}"
    state: present
    reload: "{{ sysctl_reload }}"
  loop: "{{ sysctl_items }}"
  when:
    - sysctl_items is defined
    - item.name is defined
    - item.value is defined
    - ansible_connection not in [ "container", "docker", "community.docker.docker" ]
  loop_control:
    label: "{{ item.name }}"
