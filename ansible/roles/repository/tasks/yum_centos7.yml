    gpgcheck: yes
    gpgkey: http://{{ nexus_server }}:{{ nexus_port }}/repository/epel/RPM-GPG-KEY-EPEL-7
  tags: yum_repository

- name: yum_repository | Add Nexus-EPEL-Debug repo
