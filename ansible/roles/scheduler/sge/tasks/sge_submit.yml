---

- name: sge_sumbit | Install sge submit packages only
  ansible.builtin.yum:
    name: "{{ sge_submit_pkgs }}"
    state: present
    disable_gpg_check: true
  vars:
    sge_submit_pkgs:
      - "{{ extra_packages_url }}/rpm/{{ sge_rpm }}"
      - m4
  tags: sge_sumbit

- name: sge_sumbit | Copy installation config file to destination
  ansible.builtin.template:
    src: installation.conf.j2
    dest: "{{ sge_root }}/installation.conf"
  tags: sge_sumbit

- name: sge_sumbit | Create sge cell directory
  ansible.builtin.file:
    path: "{{ sge_root }}/{{ cell_name }}/common"
    state: directory
    recurse: yes
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
  tags: sge_sumbit

- name: sge_sumbit | Generate sge common configuration files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ sge_root }}/{{ cell_name }}/common/{{ item }}"
  with_items:
    - act_qmaster
    - bootstrap
    - cluster_name
    - settings.csh
    - settings.sh
  tags: sge_sumbit

- name: sge_sumbit | Configure sge submit only
  ansible.builtin.command: ./inst_sge -noremote -s -auto installation.conf
  args:
    chdir: "{{ sge_root }}"
  tags: sge_sumbit
